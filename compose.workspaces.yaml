services:
  c4pcut:
    environment:
      C4PCUT_WORKSPACES_FILE: /run/c4pcut/workspaces.json
      C4PCUT_DATA_DIR: /data
    volumes:
      - "${C4PCUT_WORKSPACES_FILE:?Set absolute path to private workspace config}:/run/c4pcut/workspaces.json:ro"
      - c4pcut-data:/data
volumes:
  c4pcut-data:

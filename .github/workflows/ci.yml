name: C4PCUT checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m compileall -q engine.py server.py tests
      - run: node --check web/app.js
      - run: python -m unittest discover -s tests -v
      - run: node --test integration/test-studio-issuer.mjs
      - run: docker compose config
      - run: docker compose up -d --build
      - name: Private container smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/healthz; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down

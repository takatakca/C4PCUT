name: C4PCUT checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m compileall -q engine.py server.py tests
      - run: node --check web/app.js && node --check web/plan-ui.js && node --check web/effect-preview.js
      - run: python -m unittest discover -s tests -v
      - run: node --test integration/test-studio-issuer.mjs integration/test-plan-policy.mjs integration/test-v1-billing-adapter.mjs integration/test-v1-catalog-preflight.mjs integration/test-plan-ui.mjs integration/test-effect-preview.mjs
      - run: docker compose config
      - run: docker compose up -d --build
      - name: Private container smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/healthz; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install playwright==1.65.2
      - run: python -m playwright install --with-deps chromium
      - run: python integration/browser_smoke.py
